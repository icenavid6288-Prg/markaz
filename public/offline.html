<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f52">
  <title>مرکز رشد — حالت آفلاین</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#0b1f3a;background:#f5faf7}body{display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;text-align:center}.card{max-width:420px;padding:32px;border:1px solid #d8f2e2;border-radius:28px;background:#fff;box-shadow:0 18px 50px #0b1f3a14}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(135deg,#2c9a6c,#0c3b2e);color:#fff;font-size:28px;font-weight:900}.card h1{margin:0 0 10px;font-size:22px}.card p{margin:0;color:#61736c;line-height:2;font-size:14px}.card button{margin-top:22px;border:0;border-radius:12px;background:#1d7b56;color:#fff;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">ر</div><h1>اتصال اینترنت برقرار نیست</h1><p>صفحه‌های ذخیره‌شده هنوز در دسترس هستند. پس از اتصال دوباره، برای ادامه مسیر رشد تلاش کنید.</p><button onclick="location.reload()">تلاش دوباره</button></main></body>
</html>
