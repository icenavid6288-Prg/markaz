name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Stop immediately if any deployment command fails.
            set -e

            # Download the latest repository snapshot without requiring Git on the host.
            # This also works on shared hosting where the deployment directory is not a Git clone.
            git archive --remote=https://github.com/${{ github.repository }}.git origin/main | tar -x -C .

            # Regenerate Laravel caches only when the host provides the needed PHP CLI tools.
            if command -v php >/dev/null 2>&1 && [ -f artisan ]; then
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan event:cache
            fi

            # Migrations are optional and disabled unless explicitly enabled.
            if [ "${{ secrets.RUN_MIGRATIONS }}" = "true" ] && command -v php >/dev/null 2>&1 && [ -f artisan ]; then
              php artisan migrate --force
            fi

            # Shared hosting may not allow chmod; permissions are best-effort.
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "✅ Deployment complete!"
