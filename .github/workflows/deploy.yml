name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Stop immediately if any deployment command fails.
            set -e

            # Make the server match the exact commit currently on GitHub.
            # This avoids pull conflicts caused by local files on shared hosting.
            git fetch origin main
            git reset --hard origin/main

            # Dependencies and production frontend assets are committed to the repository.
            # Shared hosting does not need Composer or Node/npm during deployment.

            # Clear stale cached configuration and rebuild Laravel caches.
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Migrations are optional on shared hosting; run only when explicitly enabled.
            if [ "${{ secrets.RUN_MIGRATIONS }}" = "true" ]; then
              php artisan migrate --force
            fi

            # Shared hosting may not allow chown; chmod is best-effort.
            chmod -R 775 storage bootstrap/cache || true

            echo "✅ Deployment complete!"
